# Full commented defaults: kitty.conf.orig
# Themes: light-theme.auto.conf / dark-theme.auto.conf (auto-switch with macOS appearance)

# Fonts
font_family      SauceCodePro Nerd Font
font_size        12.0
# Thinner text, similar to iTerm's "Thin Strokes" (gamma contrast)
text_composition_strategy 1.0 0
# Narrower letter spacing; tweak if needed
modify_font cell_width 90%

# Cursor
cursor_shape          beam
cursor_blink_interval 0

# Window layout
remember_window_size  no
initial_window_width  200c
initial_window_height 60c
window_padding_width  0 15
placement_strategy    center

# Advanced
shell_integration no-cursor

# macOS
# Only effective without *.auto.conf themes; otherwise set in the theme files
macos_titlebar_color       background
macos_option_as_alt        left
macos_show_window_title_in none

# Links
detect_urls   yes
open_url_with default
url_style     curly
mouse_map left click ungrabbed mouse_handle_click selection link prompt
# Cmd+click opens links even when an app captures the mouse (pi, vim, less...)
mouse_map cmd+left press grabbed discard_event
mouse_map cmd+left click grabbed,ungrabbed mouse_handle_click link

# Keys
map shift+enter send_text all \n
# Alt+Left/Right: jump by word (ESC b / ESC f)
map alt+left  send_text all \x1bb
map alt+right send_text all \x1bf
# Pick a path on screen and open it
map cmd+shift+o kitten hints --type path --program ~/.config/kitty/open_path.sh

# Cmd+Left/Right: jump to start/end of line (Home/End)
map cmd+left send_text all \x1bOH
map cmd+right send_text all \x1bOF
