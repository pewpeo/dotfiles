# vim:set ft=tmux:
# @catppuccin_reset only clears the theme palette, not the per-module options.
# Status modules set their colors with `set -ogqF` (only-if-unset, expanded once),
# so without this they keep the previous flavor's colors after a theme switch.
# Source this *before* running catppuccin.tmux. Keep in sync with status-right.conf.
set -Ugq @catppuccin_application_color
set -Ugq @catppuccin_status_application_icon_bg
set -Ugq @catppuccin_status_application_icon_fg
set -Ugq @catppuccin_status_application_text_fg

set -Ugq @catppuccin_cpu_color
set -Ugq @catppuccin_status_cpu_icon_bg
set -Ugq @catppuccin_status_cpu_icon_fg

set -Ugq @catppuccin_ram_color
set -Ugq @catppuccin_status_ram_icon_bg
set -Ugq @catppuccin_status_ram_icon_fg

set -Ugq @catppuccin_session_color
set -Ugq @catppuccin_status_session_icon_bg
set -Ugq @catppuccin_status_session_icon_fg
set -Ugq @catppuccin_status_session_text_fg

set -Ugq @catppuccin_date_time_color
set -Ugq @catppuccin_status_date_time_icon_bg
set -Ugq @catppuccin_status_date_time_icon_fg
set -Ugq @catppuccin_status_date_time_text_fg

set -Ugq @catppuccin_battery_color
set -Ugq @catppuccin_status_battery_icon_bg
set -Ugq @catppuccin_status_battery_icon_fg
set -Ugq @catppuccin_status_battery_text_fg
