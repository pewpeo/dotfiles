# ~/.config/tmux/tmux.conf
# Beginner-friendly tmux config with easy window/pane switching

# --- General ---
set -g default-terminal "tmux-256color"
set -g mouse on                # enable mouse: click panes/windows, drag to resize, scroll
set -g base-index 1            # windows start at 1, not 0
setw -g pane-base-index 1      # panes start at 1, not 0
set -g renumber-windows on     # renumber windows when one is closed
set -g history-limit 10000
set -g escape-time 0           # faster key response (good for vim users)
set -g extended-keys on        # allow modified Enter and other extended key sequences
set -g extended-keys-format csi-u  # use csi-u format (works best with pi)
# set -g allow-passthrough on    # allow terminal escape sequences to pass through (e.g. images)
set -g allow-passthrough all   # allow terminal escape sequences to pass through (e.g. images) -> on
                               # and even from background panes (OSC 9 desktop notifications) -> all
set -g focus-events on         # forward terminal focus in/out events into panes, so apps can tell
                               # the pane is blurred and fire a notification

# --- Prefix key: Ctrl-a instead of default Ctrl-b (easier reach) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Clear screen + scrollback (like iTerm Cmd+K) ---
bind-key -n C-l send-keys C-l \; send-keys -R \; clear-history
# bind-key -n C-l clear-history

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# --- Toggle mouse mode (prefix + m) ---
# Turn tmux mouse handling off to fall back to your terminal's native
# click/drag text selection (bypasses tmux/nvim/lazygit mouse handling
# entirely). Press again to turn tmux mouse mode back on.
bind m run-shell 'if [ "$(tmux show -gv mouse)" = "on" ]; then \
  tmux set -g mouse off; tmux display-message "Mouse: OFF (native terminal selection)"; \
else \
  tmux set -g mouse on; tmux display-message "Mouse: ON"; \
fi'

# --- Window (tab) switching ---
# prefix + Left/Right to move between windows
# bind Left previous-window
# bind Right next-window

# Jump straight to a window by number: Alt+1..5 or F1..F5 (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n F1 select-window -t 1
bind -n F2 select-window -t 2
bind -n F3 select-window -t 3
bind -n F4 select-window -t 4
bind -n F5 select-window -t 5

# Create / close windows
bind c new-window -c "#{pane_current_path}"   # new window keeps current directory
# bind & kill-window
# bind x kill-pan

# Rename window
# bind , command-prompt -I "#W" "rename-window '%%'"

# --- Pane splitting (more intuitive symbols) ---
bind | split-window -h -c "#{pane_current_path}"   # vertical split (side by side)
bind - split-window -v -c "#{pane_current_path}"   # horizontal split (stacked)
unbind '"'
unbind %

# --- Copy mode (vi-style selection) ---
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar ---
# set -g status-position bottom
# set -g status-style bg=black,fg=white
# set -g status-left "#[bold]#S "
# set -g status-right "%Y-%m-%d %H:%M "
# set -g window-status-current-style bg=blue,fg=black,bold
# set -g window-status-format " #I:#W "
# set -g window-status-current-format " #I:#W "

# --- Pane borders ---
# set -g pane-border-lines single
# set -g pane-border-style fg=colour238
# set -g pane-active-border-style fg=colour39

# --- TPM --- 

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- Catppuccin theme ---
set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_flavor 'mocha'   # latte | frappe | macchiato | mocha

# --- Window text ---
# show winow name (default is #T = pane title)
%hidden CTP_WIN_TEXT=" #{b:pane_current_path}"

# show window name and process name (default is #T = pane title)
# %hidden CTP_WIN_TEXT=" #{b:pane_current_path}:#{pane_current_command}"

# show window name and process name - window only name if idle  (default is #T = pane title)
# %hidden CTP_WIN_TEXT=" #{b:pane_current_path}#{?#{==:#{pane_current_command},zsh},,:#{pane_current_command}}"

set -g @catppuccin_window_text "$CTP_WIN_TEXT"
set -g @catppuccin_window_current_text "$CTP_WIN_TEXT"

# --- Status bar ---
set-hook -g client-dark-theme {
  set -g @catppuccin_flavor "mocha"
  set -g @catppuccin_reset "true"
  set -g @catppuccin_window_status_style "basic"
  run ~/.config/tmux/plugins/tmux/catppuccin.tmux
  set -g @catppuccin_window_text "$CTP_WIN_TEXT"
  set -g @catppuccin_window_current_text "$CTP_WIN_TEXT"
  set -g @catppuccin_status_left_separator "█"
  set -g @catppuccin_status_right_separator "█"
  run ~/.config/tmux/plugins/tmux/catppuccin.tmux
}
set-hook -g client-light-theme {
  set -g @catppuccin_flavor "latte"
  set -g @catppuccin_reset "true"
  set -g @catppuccin_window_status_style "basic"
  run ~/.config/tmux/plugins/tmux/catppuccin.tmux
  set -g @catppuccin_window_text "$CTP_WIN_TEXT"
  set -g @catppuccin_window_current_text "$CTP_WIN_TEXT"
  set -g @catppuccin_status_left_separator "█"
  set -g @catppuccin_status_right_separator "█"
  run ~/.config/tmux/plugins/tmux/catppuccin.tmux
}

# --- Status bar --- 
# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
# set -agF status-right "#{E:@catppuccin_status_battery}"

# run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
# run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
